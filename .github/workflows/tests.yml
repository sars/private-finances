name: Tests
# The suite is the expensive half of CI — about five and a half minutes against
# the foundation job's one — so it is kept in its own workflow and skipped when
# a change cannot possibly affect it.
#
# `paths-ignore` skips the workflow only when *every* changed file matches, so a
# commit touching one Markdown file and one source file still runs the tests.
# Documentation-only changes were 6 of the last 40 commits on main, and each one
# was paying for all 476 tests to prove that prose had not broken the ledger.
# Repository hygiene still runs on them, in the CI workflow, which is what
# actually checks documentation.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: finances_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d finances_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:disposable-ci-only@localhost:5432/finances_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.19.0
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The lockfile is frozen, so an exact hit needs no network at all; the
      # restore-key still saves most downloads when a single dependency moves.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      # `pnpm check` runs the foundation script, Prettier and the backend compile,
      # then the tests, then the frontend typecheck and bundle. Every build step
      # happens exactly once inside it, so nothing here may repeat one.
      - run: pnpm check
